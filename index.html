<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的游戏库</title>
  <!-- 想换网站图标：把 favicon.ico 放进 assets/img/，然后去掉下面这行的注释
  <link rel="icon" href="assets/img/favicon.ico">
  -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ===== 大门页：打开网站先看到这里，点中间按钮进入游戏分享页 ===== -->
<div class="gate">

  <!-- 背景：半透明图片拼贴（图片在 data/games.js 的 gate.images 里配置） -->
  <div class="gate-tiles" id="gateTiles"></div>
  <!-- 机能风装饰：网格线、暗角、扫描线、四角十字 -->
  <div class="gate-lines"></div>
  <div class="gate-vignette"></div>
  <div class="gate-scan"></div>
  <span class="gate-cross tl"></span>
  <span class="gate-cross tr"></span>
  <span class="gate-cross bl"></span>
  <span class="gate-cross br"></span>

  <header class="gate-top">
    <span class="gate-brand" id="gateBrand">GAME VAULT</span>
    <span class="mono gate-code">01 // GATE</span>
  </header>

  <main class="gate-center">
    <span class="gate-kicker" id="gateKicker">// GAME VAULT</span>
    <h1 class="gate-title" id="gateTitle">我的游戏库</h1>
    <p class="gate-sub" id="gateSub">GAME VAULT</p>
    <p class="gate-desc" id="gateDesc">精选游戏资源 · 网盘直链下载</p>

    <a class="gate-enter" href="games.html">
      <span class="ge-cn" id="gateEnterCn">进入我的游戏分享页</span>
      <span class="ge-en" id="gateEnterEn">ENTER</span>
      <span class="ge-arrow">›</span>
    </a>
  </main>

  <footer class="gate-bottom">
    <span class="mono">SCROLL</span>
    <span class="mono" id="gateNote">资源版权归原作者所有</span>
  </footer>
</div>

<script src="data/games.js"></script>
<script src="assets/js/gate.js"></script>
</body>
</html>
