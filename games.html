<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全部游戏</title>
  <!-- 想换网站图标：把 favicon.ico 放进 assets/img/，然后去掉下面这行的注释
  <link rel="icon" href="assets/img/favicon.ico">
  -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- ===== 顶部导航 ===== -->
  <header class="navbar">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-logo" id="brandLogo">G</span>
        <span class="brand-text">
          <b id="brandName">我的游戏库</b>
          <span id="brandTag">GAME VAULT</span>
        </span>
      </a>
      <nav class="nav-links" id="navLinks"></nav>
      <a class="nav-back" href="index.html">← 返回大门</a>
    </div>
  </header>

  <!-- ===== 页面头部（编号 + 标题 + 统计） ===== -->
  <section class="page-head">
    <span class="mono head-code">02 // VAULT</span>
    <h1 class="head-title" id="headTitle">全部游戏</h1>
    <p class="head-sub" id="headSub">点击卡片上的按钮即可跳转网盘下载。</p>
    <div class="head-stats">
      <div><b id="statGames">0</b><span>Games</span></div>
      <div><b id="statLinks">0</b><span>Links</span></div>
      <div><b id="statCats">0</b><span>Tags</span></div>
    </div>
  </section>

  <!-- ===== 置顶公告（在 SITE_CONFIG.notice 里填文字才会显示） ===== -->
  <section class="notice" id="notice" style="display:none;">
    <div class="notice-inner"><b>// NOTICE</b><span id="noticeText"></span></div>
  </section>

  <!-- ===== 搜索 + 分类筛选 ===== -->
  <section class="toolbar" id="filters">
    <div class="search-box">
      <span class="mono">SEARCH</span>
      <input type="text" id="searchInput" placeholder="搜索游戏名称或简介…">
    </div>
    <div class="filters" id="filterBox"></div>
  </section>

  <!-- ===== 游戏卡片列表（由 JS 自动生成） ===== -->
  <main id="games">
    <div class="section-head">
      <h2>GAME LIST</h2>
      <span class="count" id="gameCount">共 0 个</span>
    </div>
    <div class="grid" id="gameGrid"></div>
    <div class="empty" id="emptyState" style="display:none;">NO RESULT // 没有找到相关游戏</div>
  </main>

  <!-- ===== 页脚 ===== -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <div class="brand">
          <span class="brand-logo" id="footerLogo">G</span>
          <span class="brand-text">
            <b id="footerName">我的游戏库</b>
            <span id="footerTag">GAME VAULT</span>
          </span>
        </div>
        <p id="footerText">本站仅提供网盘链接索引，资源版权归原作者所有。</p>
      </div>
      <div id="footerGroups" style="display:contents;"></div>
    </div>
    <div class="footer-bottom">
      <span>© <span id="year"></span> <span id="footerName2">我的游戏库</span></span>
      <span>Powered by GitHub Pages</span>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="data/games.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
